<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ansh Chandpara — Artist, CG Generalist & Creative Director. Selected work across title design, film, music videos, and brand storytelling."
    />
    <title>Ansh Chandpara — Artist · CG Generalist · Creative Director</title>
    <link rel="canonical" href="https://chandparaaa.in/" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Share card + Open Graph. Site-level: this is a query-routed SPA, so
         every URL serves this file and social crawlers (which do not run JS)
         see these for every page. Per-route values are set at runtime by
         hooks/useDocumentMeta for crawlers that render. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ansh Chandpara" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://chandparaaa.in/" />
    <meta property="og:title" content="Ansh Chandpara — Artist · CG Generalist · Creative Director" />
    <meta property="og:description" content="Selected work across title design, film, music videos, and brand storytelling." />
    <meta property="og:image" content="https://chandparaaa.in/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A frame from the hero loop on chandparaaa.in" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ansh Chandpara — Artist · CG Generalist · Creative Director" />
    <meta name="twitter:description" content="Selected work across title design, film, music videos, and brand storytelling." />
    <meta name="twitter:image" content="https://chandparaaa.in/og.jpg" />

    <!-- Fonts.
         Display: Obviously Variable (OH no Type Co.) from Adobe Fonts — width,
         weight and italic axes in one file. Served from Adobe's CDN and tied
         to the Creative Cloud subscription: if that lapses the kit stops, so
         the display stack falls back to Archivo (Google, self-hostable, same
         width axis) rather than to a system face.
         Body: Instrument Sans (Google). Space Grotesk + Inter were retired
         2026-09-12 — the pairing had become the signature of generated sites. -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/jkq4ugc.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
